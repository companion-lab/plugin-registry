# PR gate for the registry: schema, uniqueness, formatting, and the
# generated-markdown freshness gate. Deliberately no release lookup here —
# validate.mjs's advisory lookups run with the checkout's token, but warnings
# never fail the build (a release can land after the PR opens).
name: Validate

on:
  pull_request:
    paths:
      - "plugins.json"
      - "schema.json"
      - "scripts/**"
      - "PLUGINS.md"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Advisory release lookups (warnings only) go through the checkout's
      # token so PR runs don't burn the runner's anonymous 60 req/h budget.
      - name: Validate plugins.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate.mjs

      - name: Check PLUGINS.md is up to date
        run: node scripts/generate.mjs --check
